[project]
name = "syden-agent"
version = "0.1.0"
description = "A terminal AI assistant for construction documents and BOQs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "textual>=6.0,<7",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
syden = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]
